{% extends "tracker/layout.html" %}
{% block content %}
<section class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card recovery-card">
                <div class="card-header bg-white py-4">
                    <p class="text-uppercase text-secondary small text-center mb-2">Rumi Press account</p>
                    <h1 class="h3 text-center mb-0">Password updated</h1>
                </div>
                <div class="card-body p-4 p-md-5 text-center">
                    <p class="text-secondary mb-4">Your password has been changed. You can now sign in with your new password.</p>
                    <a class="btn btn-dark" href="{% url 'account_login' %}">Go to Login</a>
                </div>
            </div>
        </div>
    </div>
</section>
<style>
    .recovery-card {
        border: 1px solid #dee2e6;
        border-radius: 0.5rem;
        box-shadow: 0 0.75rem 2rem rgb(33 37 41 / 8%);
    }
    .recovery-card .card-header {
        border-bottom-color: #e9ecef;
    }
</style>
{% endblock %}
